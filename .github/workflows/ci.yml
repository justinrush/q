name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race -count=1 -timeout=5m ./...
      - run: go build ./...
      - name: Test release version selection
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check release packaging script
        run: bash -n scripts/build-release.sh
