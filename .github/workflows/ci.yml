name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/analytics/package-lock.json
      - run: npm --prefix web/analytics ci
      - run: npm --prefix web/analytics test
      - run: npm --prefix web/analytics run build
      - run: go build -tags analyticsui -o bin/q ./cmd/q
      - run: go test -tags analyticsui ./web/analytics
      - name: Browser smoke test
        if: runner.os == 'Linux'
        working-directory: web/analytics
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race -count=1 -timeout=5m ./...
      - run: go build ./...
      - name: Test release version selection
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check release packaging script
        run: bash -n scripts/build-release.sh
